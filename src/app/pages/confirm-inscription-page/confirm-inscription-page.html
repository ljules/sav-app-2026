<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success-subtle">
                    <h5 class="card-title">Confirmation de votre inscription</h5>
                </div>
                <div class="card-body" aria-live="polite">
                    @if (etat === 'chargement') {
                        <p role="status"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Confirmation de votre compte en cours…</p>
                    } @else if (etat === 'succes') {
                        <div class="alert alert-success" role="status">
                            <h5>Bienvenue !</h5>
                            <p class="mb-0">Votre compte est activé. Vous pouvez maintenant vous connecter.</p>
                        </div>
                        <a routerLink="/login" class="btn btn-success w-100">Connexion</a>
                    } @else {
                        <div class="alert alert-danger mb-0" role="alert">
                            <h5>Échec de la confirmation</h5>
                            <p class="mb-0">{{ messageErreur }}</p>
                        </div>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
